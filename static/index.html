<!DOCTYPE html>
<html lang="en">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width,initial-scale=1,viewport-fit=cover" name="viewport"/>
  <meta content="#0a4f73" name="theme-color"/>
  <link href="manifest.json" rel="manifest"/>
  <link href="icon.svg" rel="icon"/>
  <title>
   FindBack: Dashboard
  </title>
  <link href="style.css" rel="stylesheet"/>
 </head>
 <body>
  <main>
   <section class="hero">
    <h1>
     Lost something on campus?
    </h1>
    <p>
     Report it in a minute. We compare it with everything that has been found.
    </p>
    <div class="cta">
     <a class="btn" href="report.html?type=LOST">
      I lost something
     </a>
     <a class="btn ghost" href="report.html?type=FOUND">
      I found something
     </a>
    </div>
   </section>
   <section aria-label="Summary" class="stats" id="stats">
   </section>
   <div class="two">
    <section class="panel">
     <h2>
      Search
     </h2>
     <input aria-label="Search keyword" autocomplete="off" class="big" id="q" placeholder="Try a keyword, like wallet or black" type="search"/>
     <div id="res">
     </div>
    </section>
    <section class="panel">
     <h2>
      Recent items
     </h2>
     <div id="recent">
     </div>
    </section>
   </div>
  </main>
  <script src="app.js">
  </script>
  <script>
buildMenu('Dashboard');

var searchTimer = null;


// Shows the five summary cards at the top.
function loadStats() {
  callApi('GET', '/stats', null, function (stats) {
    var cards = [
      { key: 'total',  label: 'Items',       css: '' },
      { key: 'lost',   label: 'Lost',        css: 'l' },
      { key: 'found',  label: 'Found',       css: 'f' },
      { key: 'claims', label: 'Open claims', css: '' },
      { key: 'urgent', label: 'Urgent',      css: 'w' }
    ];

    var html = '';
    for (var i = 0; i < cards.length; i++) {
      var value = stats[cards[i].key];
      if (value === undefined) {
        value = 0;
      }
      html += '<div class="stat ' + cards[i].css + '"><b>' + value + '</b><span>' + cards[i].label + '</span></div>';
    }

    document.getElementById('stats').innerHTML = html;
  });
}


// Shows the six newest items.
function loadRecentItems() {
  callApi('GET', '/items', null, function (items) {
    var recent = items.slice(0, 6);
    document.getElementById('recent').innerHTML = makeItemRows(recent, false);
  });
}


// Searches the items for what the person typed.
function searchItems() {
  var text = document.getElementById('q').value.trim();
  var resultBox = document.getElementById('res');

  if (text.length === 0) {
    resultBox.innerHTML = '';
    return;
  }

  if (text.length < 2) {
    resultBox.innerHTML = '<p class="meta">Keep typing, at least 2 letters.</p>';
    return;
  }

  callApi('GET', '/search?q=' + encodeURIComponent(text), null, function (data) {
    if (data.items.length === 0) {
      resultBox.innerHTML = '<div class="empty"><b>No matches</b>Try a shorter or different keyword.</div>';
    } else {
      resultBox.innerHTML = makeItemRows(data.items, false);
    }
  });
}


// Wait a moment after typing stops, then search.
document.getElementById('q').oninput = function () {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(searchItems, 250);
};

loadStats();
loadRecentItems();
</script>
 </body>
</html>
